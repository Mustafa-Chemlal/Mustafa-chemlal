    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#0B192C',
                            900: '#070F1E',
                            950: '#030712',
                        },
                        brand: {
                            light: '#38BDF8',
                            DEFAULT: '#0284C7',
                            dark: '#0369A1',
                            accent: '#6366F1'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar and glassmorphism styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0284c7;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Animación de cambio de color: Azul celeste a Azul marino (Nombre Principal) */
        @keyframes glowCycleSkyToNavy {
            0%, 100% {
                color: #7DD3FC; /* Azul celeste */
                text-shadow: 0 0 18px rgba(125, 211, 252, 0.85), 0 0 32px rgba(125, 211, 252, 0.45);
            }
            50% {
                color: #1D4ED8; /* Azul marino intenso con brillo para fondo oscuro */
                text-shadow: 0 0 18px rgba(59, 130, 246, 0.8), 0 0 32px rgba(30, 64, 175, 0.55);
            }
        }

        .animate-name-glow {
            animation: glowCycleSkyToNavy 3.2s infinite ease-in-out;
        }

        /* Animación de cambio de color: Azul celeste a Azul marino (Nombres de Empresas) */
        @keyframes companyCycleSkyToNavy {
            0%, 100% {
                color: #7DD3FC; /* Azul celeste */
                text-shadow: 0 0 12px rgba(125, 211, 252, 0.6);
            }
            50% {
                color: #3B82F6; /* Azul marino brillante */
                text-shadow: 0 0 12px rgba(59, 130, 246, 0.65);
            }
        }

        .animate-company-colors {
            animation: companyCycleSkyToNavy 3.2s infinite ease-in-out;
        }

        /* Animación de movimiento de izquierda a derecha para el subtítulo */
        @keyframes moveLeftToRight {
            0%, 100% {
                transform: translateX(-14px);
            }
            50% {
                transform: translateX(14px);
            }
        }

        .animate-slide-lr {
            display: inline-block;
            animation: moveLeftToRight 3.2s infinite ease-in-out;
        }

        /* Transición suave entre páginas */
        .page-section {
            animation: fadeInPage 0.35s ease-out;
        }

        @keyframes fadeInPage {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
